name: jnsgruk
base: ubuntu@26.04

sdks:
  - name: codex
  - name: node
    channel: 22/stable
  - name: project-hugo
    slots:
      hugo:
        interface: tunnel
        endpoint: localhost:1313
  - name: project-imagemagick
  - name: system
    plugs:
      hugo:
        interface: tunnel
        endpoint: localhost:1313

connections:
  - plug: system:hugo
    slot: hugo:hugo

actions:
  build: |
    set -euo pipefail
    npm ci
    scripts/check-images
    npm run build -- "$@"
  generate: |
    set -euo pipefail
    npm run build -- "$@"
  dev: |
    set -euo pipefail
    npm run dev -- "$@"
  check: |
    set -euo pipefail
    npm ci
    npm run check -- "$@"
  preview: |
    set -euo pipefail
    npm run preview -- "$@"
  deploy: |
    set -euo pipefail
    : "${CLOUDFLARE_API_TOKEN:?Forward CLOUDFLARE_API_TOKEN with workshop run --env CLOUDFLARE_API_TOKEN}"
    : "${CLOUDFLARE_ACCOUNT_ID:?Forward CLOUDFLARE_ACCOUNT_ID with workshop run --env CLOUDFLARE_ACCOUNT_ID}"
    npm run deploy -- "$@"
  images-optimize: |
    set -euo pipefail
    scripts/optimize-image "$@"
  images-check: |
    set -euo pipefail
    scripts/check-images
