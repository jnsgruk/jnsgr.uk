[tools]
go = "1.26"
"go:golang.org/x/tools/gopls" = "latest"
hugo-extended = "latest"
imagemagick = "latest"
flyctl = "latest"
gofumpt = "latest"
nodejs = "latest"
prettier = "latest"

[tasks.build]
description = "Build the application"
depends = ["images:check"]
run = """
COMMIT=$(git rev-parse --short HEAD)
go generate ./...
go build -o jnsgruk -ldflags "-X main.commit=${COMMIT}" .
"""

[tasks.generate]
description = "Generate the Hugo site"
run = "go generate ./..."

[tasks.dev]
description = "Run Hugo dev server"
run = "hugo serve --bind 0.0.0.0 -s site -F "

[tasks."images:optimize"]
description = "Convert a source image to an optimized WebP asset"
run = "scripts/optimize-image"

[tasks."images:check"]
description = "Check content images against the asset policy"
run = "scripts/check-images"
