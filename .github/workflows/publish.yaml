name: Publish
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Launch Workshop
        uses: canonical/launch-workshop@b538173e2c4163488c4628b4aef79a6002475e76 # v1
        with:
          cache: node:npm-cache
      - name: Build and validate deployment
        run: workshop run -- check
      - name: Publish to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: workshop run --env CLOUDFLARE_ACCOUNT_ID --env CLOUDFLARE_API_TOKEN -- deploy
