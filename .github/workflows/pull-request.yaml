name: Pull Request
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Launch Workshop
        uses: canonical/launch-workshop@b9e184e38f49808ced78e25de19483fe02484c46 # v1
        with:
          cache: node:npm-cache
      - name: Build and validate deployment
        run: workshop run -- check
