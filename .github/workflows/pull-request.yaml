name: Build
on:
  pull_request:
    branches:
      - main

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rockcraft and LXD
        uses: canonical/craft-actions/rockcraft/setup@main
        with:
          lxd-channel: 6/stable

      - name: Launch Workshop
        uses: canonical/launch-workshop@b538173e2c4163488c4628b4aef79a6002475e76 # v1
        with:
          cache: go:mod-cache

      - name: Check images
        run: workshop run -- images-check

      - name: Build rock
        uses: canonical/craft-actions/rockcraft/pack@main
